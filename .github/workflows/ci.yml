name: dataset

# The dataset is committed, so CI's job is to prove it can still be rebuilt from
# the staging documents and that the rebuild is internally consistent. It never
# touches the network: `make collect` is deliberately not run here, because
# hitting the chamber's and Al Bawsala's servers on every push would be rude and
# would make the build depend on their uptime.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor claimed in the README; 3.12 guards against drift.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: make test

      - name: Rebuild the dataset from staging documents
        run: make build

      - name: Validate
        # Exits non-zero on any error: dangling foreign keys, duplicate primary
        # keys, values outside a declared vocabulary, end dates before start
        # dates, rates outside [0,1]. Warnings do not fail the build.
        run: make validate

      - name: Derive network files
        run: make networks

      - name: Regenerate documentation
        run: make codebook

      - name: Check the rebuild is reproducible
        # A rebuild from the same staging data must be byte-identical. If this
        # fails, something in the pipeline is non-deterministic (dict ordering,
        # a timestamp leaking into a data file) and the committed dataset cannot
        # be trusted to match the code that claims to produce it.
        run: |
          if ! git diff --quiet -- data/processed data/networks; then
            echo "::error::Rebuild changed the committed data. Diff:"
            git diff --stat -- data/processed data/networks
            git diff -- data/processed data/networks | head -100
            exit 1
          fi
          echo "Rebuild is byte-identical to the committed dataset."

      - name: Confirm no contact details reached the published tables
        # Upstream records carry emails, phone numbers and home addresses. The
        # collectors do not map them into the staging shape, and this asserts
        # that stays true: a future field added to a collector must not leak
        # personal contact data into a public CSV.
        run: |
          if grep -rlE '[[:alnum:]._%+-]+@[[:alnum:].-]+\.[a-z]{2,}' data/processed data/networks; then
            echo "::error::An email address appears in the published tables."
            exit 1
          fi
          echo "No contact details in the published tables."

      - name: Run the worked example
        run: python examples/example_python.py

  figures:
    # Separate job because plotting needs matplotlib/networkx, which the dataset
    # pipeline deliberately does not depend on. Rendering the set is also the
    # only check that the Arabic-label guard still has a gloss for every value
    # in the data: a new bloc or committee name with no gloss fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-figures.txt

      - name: Unit tests, including the ones that need the plotting stack
        # The build job runs these too, but skips any test that imports a figure
        # module, since it installs the pipeline's dependencies alone. Running
        # the suite again here is what stops those skips from being silent: a
        # test guarded on matplotlib would otherwise never execute anywhere.
        run: make test

      - name: Render all figures
        run: make figures

      - name: No figure's title may run past its frame
        # bbox_inches="tight" widens the canvas rather than clipping, so an
        # overlong title is invisible in the PNG and only shows up as a figure
        # far wider than its figsize. Measured rather than eyeballed.
        run: python figures/check_caption_fit.py

      - name: Every figure must ship its table view
        run: |
          missing=0
          for png in figures/output/fig*.png; do
            case "$png" in *_dark.png) continue;; esac
            csv="${png%.png}.csv"
            if [ ! -s "$csv" ]; then
              echo "::error::$png has no companion table ($csv)"
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "All figures have a companion CSV."

      - name: Run the voting-space analysis
        # Lives in this job rather than the build job because it needs numpy,
        # which the pipeline deliberately does not depend on. It prints the
        # numbers docs/FINDINGS.md section 6 quotes, so running it here keeps
        # that claim from drifting away from the data silently.
        run: python examples/voting_space.py

      - name: Figures must be reproducible
        # Rendering twice must give the same bytes. A figure that iterates a
        # Python set of ids is not reproducible — string hashing is randomised
        # per process, so node order, tie-broken row order and any seeded layout
        # that depends on it all move between runs. That happened here, silently,
        # and only showed up as an unexplained diff in a committed table.
        run: |
          find figures/output -name 'fig*' -type f | sort | xargs md5sum > /tmp/first.txt
          make figures
          find figures/output -name 'fig*' -type f | sort | xargs md5sum > /tmp/second.txt
          if ! diff -u /tmp/first.txt /tmp/second.txt; then
            echo "::error::figures are not reproducible — two renders differ"
            exit 1
          fi
          echo "Two renders produced identical bytes."
